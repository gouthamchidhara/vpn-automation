[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-auto-login"
version = "0.1.0"
description = "Automated Cisco AnyConnect + Ping Identity + Duo login tool"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "pywinauto>=0.6.8",
    "keyring>=24.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.scripts]
vpn-login = "src.main:cli"
